<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no text-align:center">
    <title>Voice Secretary v1.2.9 - Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cyan: #00f2ea;
            --pink: #ff0050;
            --grad: linear-gradient(135deg, #ff0050, #00f2ea);
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: sans-serif;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--grad);
            mask: radial-gradient(transparent 74px, #000 76px);
            -webkit-mask: radial-gradient(transparent 74px, #000 76px);
            animation: spin 15s linear infinite;
        }

        .recording .ring {
            animation: pulse 0.7s infinite;
            mask: none;
            -webkit-mask: none;
            background: var(--pink);
            opacity: 0.5;
            transform: scale(1.2);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1.02);
            }

            50% {
                transform: scale(1.1);
            }
        }

        #fullTrace {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #333;
            font-size: 10px;
            padding: 12px;
            overflow-y: scroll;
            z-index: 1000;
            color: #eee;
            line-height: 1.4;
            font-family: monospace;
        }

        .trace-err {
            color: #ff4444;
        }

        .trace-sys {
            color: #888;
        }

        .trace-recv {
            color: #f0f;
        }

        .trace-audio {
            color: #0df;
            font-weight: bold;
        }

        #micLevel {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 10px;
            color: #0f0;
            z-index: 2000;
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center">
    <div id="micLevel">MIC: 0%</div>

    <div class="flex-1 w-full max-w-md flex flex-col items-center justify-between py-10 px-8 text-center"
        style="height: 65vh">
        <header>
            <h1 class="text-xs font-bold tracking-widest uppercase opacity-50">Gemini 2.5 Native <span
                    class="block text-[9px]">v1.2.9 PERFORMANCE MODE</span></h1>
        </header>
        <div class="main flex-1 flex items-center justify-center">
            <div id="btn" class="relative w-44 h-44 cursor-pointer active:scale-95 transition-transform">
                <div class="ring"></div>
                <div class="fill absolute inset-3 bg-zinc-950 rounded-full flex flex-col items-center justify-center">
                    <div id="recText" class="text-[11px] font-bold text-zinc-500 tracking-widest uppercase">Tap & Speak
                    </div>
                </div>
            </div>
        </div>
        <div id="status" class="text-zinc-500 text-[10px] mb-4 uppercase">Ready to talk.</div>
    </div>

    <div id="fullTrace"></div>

    <script>
        const API_KEY = "AIzaSyA11HNJShWzJcEvfZh9JewKgzLUMSMSmpU";
        const traceEl = document.getElementById('fullTrace'), micEl = document.getElementById('micLevel'), st = document.getElementById('status'), txt = document.getElementById('recText'), btn = document.getElementById('btn');

        function trace(msg, type = '') {
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `• ${msg}`;
            traceEl.appendChild(div);
            // Limit DOM nodes to 50 items for mobile performance
            if (traceEl.childNodes.length > 50) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
        }

        let ws, audioCtx, processor, isRecording = false, nextStartTime = 0, pcmSentCount = 0;

        async function connectGemini() {
            const MODEL_NAME = "models/gemini-2.5-flash-native-audio-preview-12-2025";
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
                ws = new WebSocket(url);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    trace("Connected to Gemini Server.", 'sys');
                    const setup = {
                        setup: {
                            model: MODEL_NAME,
                            generation_config: { response_modalities: ["AUDIO"] }
                        }
                    };
                    ws.send(JSON.stringify(setup));
                };

                ws.onclose = () => trace("Connection Closed.", 'err');
                ws.onmessage = async (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        playRawBinaryPCM(e.data);
                        // Summary only (don't dump raw bytes)
                        if (pcmSentCount % 50 === 0) trace("Receiving voice stream...", 'audio');
                    } else {
                        const data = JSON.parse(e.data);
                        if (data.setupComplete) trace("⭐ AI is ready to listen.", 'sys');
                        if (data.error) trace(`Error: ${data.error.message}`, 'err');

                        const sc = data.serverContent || data.server_content;
                        if (sc) {
                            const turn = sc.modelTurn || sc.model_turn;
                            if (turn?.parts?.[0]) {
                                const part = turn.parts[0];
                                if (part.inlineData) playRawPCM_B64(part.inlineData.data);
                                if (part.text) trace(`AI: ${part.text}`, 'recv');
                            }
                        }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                processor = audioCtx.createScriptProcessor(2048, 1, 1);
                source.connect(processor); processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    let p = 0; for (let v of input) if (Math.abs(v) > p) p = Math.abs(v);
                    micEl.innerText = `MIC: ${Math.round(p * 100)}%`;

                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                    ws.send(JSON.stringify({
                        realtime_input: { media_chunks: [{ data: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer))), mime_type: "audio/pcm;rate=16000" }] }
                    }));
                    pcmSentCount++;
                };

            } catch (err) { trace(`Boot failed: ${err.message}`, 'err'); }
        }

        function playRawBinaryPCM(buffer) {
            try {
                const pcm16 = new Int16Array(buffer);
                const floats = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;
                const audioBuf = audioCtx.createBuffer(1, floats.length, 24000);
                audioBuf.getChannelData(0).set(floats);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuf; source.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (nextStartTime < now) nextStartTime = now;
                source.start(nextStartTime);
                nextStartTime += audioBuf.duration;
            } catch (e) { }
        }

        function playRawPCM_B64(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            playRawBinaryPCM(bytes.buffer);
        }

        async function start() {
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            if (!ws || ws.readyState !== 1) await connectGemini();
            pcmSentCount = 0; isRecording = true;
            btn.classList.add('recording'); txt.innerText = 'LISTENING';
            st.innerText = "Speak now...";
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording'); txt.innerText = 'Tap & Speak';
            st.innerText = "Processing...";
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ realtime_input: { audio_stream_end: true } }));
        }

        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = (e) => { e.preventDefault(); start(); }; btn.ontouchend = stop;

        trace("Performance Mode ready.", 'sys');
    </script>
</body>

</html>
