<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no text-align:center">
    <title>Voice Secretary v1.2.8 - Binary Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cyan: #00f2ea;
            --pink: #ff0050;
            --grad: linear-gradient(135deg, #ff0050, #00f2ea);
        }

        body {
            background: #001;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--grad);
            mask: radial-gradient(transparent 74px, #000 76px);
            -webkit-mask: radial-gradient(transparent 74px, #000 76px);
            animation: spin 15s linear infinite;
        }

        .recording .ring {
            animation: pulse 0.7s infinite;
            mask: none;
            -webkit-mask: none;
            background: var(--pink);
            opacity: 0.5;
            transform: scale(1.2);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1.05);
            }

            50% {
                transform: scale(1.2);
            }
        }

        #fullTrace {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20vh;
            background: #000;
            border-top: 2px solid #555;
            font-size: 8px;
            padding: 10px;
            overflow-y: scroll;
            z-index: 1000;
            color: #0d0;
            line-height: 1.2;
            word-break: break-all;
        }

        .trace-err {
            color: #fff;
            background: #d33;
            font-weight: bold;
        }

        .trace-sys {
            color: #888;
            border-left: 2px solid #888;
            padding-left: 4px;
        }

        .trace-send {
            color: #0af;
            border-left: 2px solid #0af;
            padding-left: 4px;
        }

        .trace-recv {
            color: #f0f;
            border-left: 2px solid #f0f;
            padding-left: 4px;
            border-bottom: 1px dotted #333;
        }

        .trace-audio {
            color: #000;
            background: #0df;
            font-weight: bold;
        }

        .trace-important {
            color: #000;
            background: #0f0;
            font-weight: bold;
        }

        #micLevel {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 10px;
            color: #0f0;
            z-index: 2000;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px;
            border-radius: 4px;
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center">
    <div id="micLevel">MIC LVL: 0%</div>

    <div class="flex-1 w-full max-w-md flex flex-col items-center justify-between py-6 px-8 text-center">
        <header>
            <h1 class="text-xs font-bold italic tracking-tighter uppercase">Gemini 2.5 Native <span
                    class="text-[9px] text-zinc-600 block">v1.2.8 (Binary Stream Mode)</span></h1>
        </header>
        <div class="main flex-1 flex items-center justify-center">
            <div id="btn" class="relative w-36 h-36 cursor-pointer active:scale-95 transition-transform">
                <div class="ring"></div>
                <div class="fill absolute inset-3 bg-zinc-950 rounded-full flex flex-col items-center justify-center">
                    <div id="recText" class="text-[10px] font-bold text-zinc-600 tracking-widest uppercase">READY</div>
                </div>
            </div>
        </div>
        <div id="status" class="text-zinc-500 text-[8px] mb-2 font-mono uppercase">Reference 143 compliance</div>
    </div>

    <!-- Trace Logger -->
    <div id="fullTrace">
        <div class="trace-sys">--- V1.2.8 BINARY PROTOCOL DECODER ---</div>
    </div>

    <script>
        // const API_KEY = "AIzaSyA11HNJShWzJcEvfZh9JewKgzLUMSMSmpU"; // サーバー側に移動
        const traceEl = document.getElementById('fullTrace'), micEl = document.getElementById('micLevel'), txt = document.getElementById('recText'), btn = document.getElementById('btn');

        // 認証状態チェック
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                const auth = await response.json();
                if (!auth.authenticated) {
                    // 未ログインの場合はログイン画面を表示
                    document.body.innerHTML = `
                        <div class="h-screen flex flex-col items-center justify-center bg-gray-900 text-white">
                            <div class="text-center">
                                <h1 class="text-2xl font-bold mb-4">Voice Secretary</h1>
                                <p class="mb-6">woodstock.co.jpドメインのアカウントでログインしてください</p>
                                <a href="/auth/login" class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded-lg inline-block">
                                    Googleでログイン
                                </a>
                            </div>
                        </div>
                    `;
                    return false;
                }
                console.log('ログイン済み:', auth.email);
                return true;
            } catch (error) {
                console.error('認証チェックエラー:', error);
                return false;
            }
        }

        function trace(msg, type = '') {
            if (type === 'audio' || type === 'recv' || type === 'send') return; // 高頻度ログをスキップ
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            if (traceEl.childNodes.length > 100) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
        }

        let ws, audioCtx, processor, isRecording = false, nextStartTime = 0, pcmSentCount = 0;

        async function connectGemini() {
            const MODEL_NAME = "models/gemini-2.5-flash-native-audio-preview-12-2025";
            trace(`INIT: ${MODEL_NAME}`, 'sys');
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // サーバー側からWebSocket URLを取得
                const response = await fetch('/api/gemini-websocket-url');
                const data = await response.json();
                if (!data.url) {
                    trace("ERROR: WebSocket URLの取得に失敗", 'err');
                    return;
                }

                const url = data.url;
                ws = new WebSocket(url);

                // Manual 143: Binary-capable configuration
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    trace("🔥 NETWORK_LINK: OK (Binary Mode)", 'sys');
                    const setup = {
                        setup: {
                            model: MODEL_NAME,
                            generation_config: { response_modalities: ["AUDIO"] }
                        }
                    };
                    ws.send(JSON.stringify(setup));
                    trace("SENT: JSON Setup package", 'send');
                };

                ws.onclose = (ev) => trace(`🔌 CLOSED [${ev.code}] ${ev.reason}`, 'err');
                ws.onerror = (e) => trace("❌ NETWORK_ERROR", 'err');

                ws.onmessage = async (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        // Binary Frame received (Likely Raw Audio per Manual 143)
                        const bytes = new Uint8Array(e.data);
                        trace(`RECV_BIN: ${bytes.length} bytes [${bytes.slice(0, 4).join(',')}]`, 'audio');

                        // Try parsing as JSON first in case it's a JSON frame sent as binary
                        try {
                            const text = new TextDecoder().decode(e.data);
                            const json = JSON.parse(text);
                            trace(`RECV_JSON_IN_BIN: ${text}`, 'recv');
                            handleJSON(json);
                        } catch (err) {
                            // Truly binary PCM audio (24kHz as per Manual 476)
                            playRawBinaryPCM(e.data);
                        }
                    } else {
                        // Text Frame received (Standard JSON)
                        trace(`RECV_TEXT: ${e.data}`, 'recv');
                        try { handleJSON(JSON.parse(e.data)); } catch (err) { trace(`PARSE_ERR: ${err.message}`, 'err'); }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                trace("🎤 MIC ACCESS OK", 'sys');
                const source = audioCtx.createMediaStreamSource(stream);
                processor = audioCtx.createScriptProcessor(2048, 1, 1);
                source.connect(processor); processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    let p = 0; for (let v of input) if (Math.abs(v) > p) p = Math.abs(v);
                    micEl.innerText = `MIC LVL: ${Math.round(p * 100)}%`;

                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;

                    const packet = {
                        realtime_input: {
                            media_chunks: [{
                                data: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer))),
                                mime_type: "audio/pcm;rate=16000"
                            }]
                        }
                    };
                    ws.send(JSON.stringify(packet));
                    pcmSentCount++;
                };

            } catch (err) { trace(`BOOT_ERR: ${err.message}`, 'err'); }
        }

        function handleJSON(data) {
            if (data.setupComplete || data.setup_complete) trace("⭐ setupComplete received!", 'important');
            if (data.error) trace(`🚨 SERVER_ERROR: ${JSON.stringify(data.error)}`, 'err');

            const sc = data.serverContent || data.server_content;
            if (sc) {
                const turn = sc.modelTurn || sc.model_turn;
                if (turn?.parts?.[0]) {
                    const part = turn.parts[0];
                    if (part.inlineData || part.inline_data) {
                        const audioB64 = (part.inlineData || part.inline_data).data;
                        trace(`🔊 AUDIO_JSON RECEIVED (${audioB64.length} chars)`, 'important');
                        playRawPCM_Base64(audioB64);
                    }
                }
            }
        }

        function playRawBinaryPCM(buffer) {
            try {
                const pcm16 = new Int16Array(buffer);
                const floats = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                const audioBuf = audioCtx.createBuffer(1, floats.length, 24000); // 24kHz stream
                audioBuf.getChannelData(0).set(floats);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuf; source.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (nextStartTime < now) nextStartTime = now;
                source.start(nextStartTime);
                nextStartTime += audioBuf.duration;
            } catch (e) { trace(`BIN_PLAY_ERR: ${e.message}`, 'err'); }
        }

        function playRawPCM_Base64(base64) {
            const binary = atob(base64), bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            playRawBinaryPCM(bytes.buffer);
        }

        async function start() {
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            if (!ws || ws.readyState !== 1) await connectGemini();
            pcmSentCount = 0; isRecording = true;
            btn.classList.add('recording'); txt.innerText = 'ON';
            trace("🎤 MIC ON", 'sys');
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording'); txt.innerText = 'READY';
            trace(`🎤 MIC OFF (Sent ${pcmSentCount})`, 'sys');
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ realtime_input: { audio_stream_end: true } }));
                trace("SENT: audio_stream_end", 'send');
            }
        }

        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = (e) => { e.preventDefault(); start(); }; btn.ontouchend = stop;

        // ページ読み込み時に認証チェック
        window.addEventListener('load', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                trace("v1.2.8 Hybrid Protocol Loaded.");
            }
        });
    </script>
</body>

</html>
