<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Internal Audio AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cyan: #00f2ea;
            --pink: #ff0050;
            --grad: linear-gradient(135deg, #ff0050, #00f2ea);
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--grad);
            mask: radial-gradient(transparent 74px, #000 76px);
            -webkit-mask: radial-gradient(transparent 74px, #000 76px);
            animation: spin 15s linear infinite;
        }

        .recording .ring {
            animation: pulse 0.7s infinite;
            mask: none;
            -webkit-mask: none;
            background: var(--pink);
            opacity: 0.5;
            transform: scale(1.2);
            box-shadow: 0 0 60px var(--pink);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1.05);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center justify-center">

    <div class="container max-w-md h-full flex flex-col items-center justify-between py-16 px-8 text-center">
        <header>
            <h1 class="text-4xl font-black leading-tight italic">
                <span style="color:var(--cyan)">VOICE</span><br>SECRETARY.
            </h1>
        </header>

        <div class="main flex-1 flex items-center justify-center">
            <div id="btn" class="relative w-56 h-56 cursor-pointer active:scale-95 transition-transform">
                <div class="ring"></div>
                <div
                    class="fill absolute inset-4 bg-zinc-900 rounded-full flex flex-col items-center justify-center border border-zinc-800 shadow-inner">
                    <div class="text-6xl mb-2">🎙️</div>
                    <div id="recText" class="text-[10px] font-bold text-zinc-500 tracking-widest">READY</div>
                </div>
            </div>
        </div>

        <div class="status-box">
            <div id="status" class="text-zinc-400 text-sm mb-4">ボタンを長押しして話しかけてください</div>
        </div>
    </div>

    <script>
        let ws = null;
        let audioCtx = null;
        let processor = null;
        let isRecording = false;

        const btn = document.getElementById('btn');
        const st = document.getElementById('status');
        const txt = document.getElementById('recText');

        async function init() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${proto}//${location.host}/ws`);
                ws.binaryType = 'arraybuffer';

                ws.onmessage = async (e) => {
                    // Python サーバーからはバイナリオーディオが直接届く
                    const buffer = await audioCtx.decodeAudioData(e.data);
                    const src = audioCtx.createBufferSource();
                    src.buffer = buffer;
                    src.connect(audioCtx.destination);
                    src.start();
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const src = audioCtx.createMediaStreamSource(stream);
                processor = audioCtx.createScriptProcessor(2048, 1, 1);
                src.connect(processor);
                processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        pcm[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                    }
                    ws.send(pcm.buffer);
                };
                st.innerText = "接続されました。どうぞ！";
            } catch (err) {
                console.error("Init error:", err);
                st.innerText = "マイクまたはサーバーの初期化に失敗しました。";
            }
        }

        function start() {
            if (!audioCtx) init();
            isRecording = true;
            btn.classList.add('recording');
            txt.innerText = 'LISTENING';
            st.innerText = "聴いています...";
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording');
            txt.innerText = 'READY';
            st.innerText = "考えています...";
        }

        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = (e) => { e.preventDefault(); start(); }; btn.ontouchend = stop;
    </script>
</body>

</html>
