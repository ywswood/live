<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>woodstock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
</head>

<body class="bg-white text-black min-h-screen">
    <header class="bg-black border-b border-red-600">
        <div class="container mx-auto px-4 py-3">
            <h1 class="text-lg font-bold text-white">woodstock</h1>
            <div class="text-xs text-gray-300">v1.5.6-native</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white border border-red-600 rounded-lg p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-black">Voice Assistant</h2>
                    <button id="logout-btn" class="text-sm text-gray-600 hover:text-red-600">ログアウト</button>
                </div>

                <div class="mb-6">
                    <button id="mic-btn"
                        class="w-full bg-red-600 hover:bg-red-700 border border-red-600 rounded-lg p-4 transition-colors">
                        <div class="text-center">
                            <div class="text-2xl mb-2">🎤</div>
                            <div id="mic-status" class="text-sm text-white">READY</div>
                        </div>
                    </button>
                </div>

                <div class="bg-gray-100 border border-red-600 rounded p-4">
                    <div class="text-sm text-black mb-2">Microphone Level</div>
                    <div id="mic-level" class="text-lg font-mono text-black">MIC LVL: 0%</div>
                </div>
            </div>

            <div class="bg-white border border-red-600 rounded-lg p-6">
                <h3 class="text-lg font-semibold text-black mb-4">System Log</h3>
                <div id="trace-log"
                    class="bg-gray-100 border border-red-600 rounded p-4 h-64 overflow-y-auto font-mono text-xs text-black">
                </div>
            </div>
        </div>
    </main>

    <script>
        const APP_VERSION = 'v1.5.6-native';
        const btn = document.getElementById('mic-btn');
        const txt = document.getElementById('mic-status');
        const micEl = document.getElementById('mic-level');
        const traceEl = document.getElementById('trace-log');
        const logoutBtn = document.getElementById('logout-btn');

        // 認証チェック
        async function checkAuth() {
            try {
                trace("🔍 認証チェック開始", 'sys');
                const response = await fetch('/auth/me');
                const auth = await response.json();

                if (!auth.authenticated) {
                    trace("❌ 未認証：ログイン画面を表示", 'sys');
                    document.body.innerHTML = `
                        <div class="h-screen flex flex-col items-center justify-center bg-white text-black">
                            <div class="bg-white border border-red-600 rounded-lg p-8 max-w-md w-full mx-4">
                                <h1 class="text-2xl font-bold text-black mb-6 text-center">woodstock</h1>
                                <div class="text-sm text-gray-600 mb-6 text-center">${APP_VERSION}</div>
                                <form id="login-form" class="space-y-4">
                                    <div>
                                        <input type="email" id="email" placeholder="メールアドレス" required
                                               class="w-full px-3 py-2 border border-red-600 rounded bg-white text-black">
                                    </div>
                                    <div>
                                        <input type="password" id="password" placeholder="パスワード" required
                                               class="w-full px-3 py-2 border border-red-600 rounded bg-white text-black">
                                    </div>
                                    <button type="submit" 
                                            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                                        ログイン
                                    </button>
                                </form>
                                <div id="login-error" class="text-red-600 text-sm mt-4 text-center hidden"></div>
                            </div>
                        </div>
                    `;
                    document.getElementById('login-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const email = document.getElementById('email').value;
                        const password = document.getElementById('password').value;
                        const errorDiv = document.getElementById('login-error');
                        try {
                            const response = await fetch('/simple-auth', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email, password })
                            });
                            if (response.ok) {
                                window.location.reload();
                            } else {
                                const error = await response.json();
                                errorDiv.textContent = error.detail || 'ログインに失敗しました';
                                errorDiv.classList.remove('hidden');
                            }
                        } catch (err) {
                            errorDiv.textContent = 'ログインエラー: ' + err.message;
                            errorDiv.classList.remove('hidden');
                        }
                    });
                    return false;
                }

                trace("✅ 認証済み", 'sys');
                return true;

            } catch (error) {
                trace(`❌ 認証エラー: ${error.message}`, 'err');
                return false;
            }
        }

        function getSessionId() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'session_id') return decodeURIComponent(value);
            }
            return null;
        }

        function trace(msg, type = '') {
            if (type === 'audio' || type === 'send') return; // 高頻度ログをスキップ
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            if (traceEl.childNodes.length > 100) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
        }

        // ================================================
        // 音声コンテキスト（録音用・再生用を分離）
        // ================================================
        let ws, micCtx, playCtx, processor, isRecording = false;
        let nextStartTime = 0, pcmSentCount = 0, isPlaying = false, audioSources = [];
        let playbackCount = 0;

        // 再生用AudioContext（24kHz出力用、デバイスデフォルトレート）
        function ensurePlayContext() {
            if (!playCtx) {
                playCtx = new (window.AudioContext || window.webkitAudioContext)();
                trace(`🔊 再生用AudioCtx: ${playCtx.sampleRate}Hz`, 'sys');
            }
            if (playCtx.state === 'suspended') {
                playCtx.resume();
            }
            return playCtx;
        }

        // ================================================


        // ================================================
        // WebSocket接続
        // ================================================
        async function connectGemini() {
            trace(`INIT: ${APP_VERSION}`, 'sys');
            try {
                let sessionId = getSessionId();
                if (!sessionId) {
                    trace("❌ セッションID不明", 'err');
                    return;
                }

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws?session_id=${sessionId}`;
                trace(`🔗 WebSocket接続中...`, 'sys');
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    trace("🔥 サーバー接続OK", 'sys');
                };

                ws.onclose = (ev) => {
                    trace(`🔌 切断 [${ev.code}]`, 'err');
                    ws = null;
                };

                ws.onerror = (e) => {
                    trace("❌ 接続エラー", 'err');
                };

                ws.onmessage = (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        // バイナリデータ = Geminiからの音声
                        const bytes = new Uint8Array(e.data);
                        if (bytes.length > 0) {
                            playbackCount++;
                            if (playbackCount <= 3) {
                                trace(`🔊 音声受信: ${bytes.length}bytes (#${playbackCount})`, 'sys');
                            }
                            playRawBinaryPCM(e.data);
                        }
                    } else {
                        // テキストデータ = DEBUGメッセージ
                        if (e.data.startsWith('DEBUG:')) {
                            trace(`🔧 ${e.data}`, 'sys');
                        }
                    }
                };

            } catch (err) {
                trace(`接続エラー: ${err.message}`, 'err');
            }
        }

        // ================================================
        // 音声再生（Geminiからの24kHz PCM）
        // ================================================
        function playRawBinaryPCM(buffer) {
            try {
                const ctx = ensurePlayContext();
                const pcm16 = new Int16Array(buffer);
                if (pcm16.length === 0) return;

                const floats = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                // 24kHzのバッファを作成 → AudioContextが自動リサンプリング
                const audioBuf = ctx.createBuffer(1, floats.length, 24000);
                audioBuf.getChannelData(0).set(floats);
                const source = ctx.createBufferSource();
                source.buffer = audioBuf;
                source.connect(ctx.destination);

                const now = ctx.currentTime;
                if (nextStartTime < now) nextStartTime = now;
                source.start(nextStartTime);

                // 割り込み対応：音源を追跡
                audioSources.push(source);
                isPlaying = true;

                source.onended = () => {
                    const index = audioSources.indexOf(source);
                    if (index > -1) audioSources.splice(index, 1);
                    if (audioSources.length === 0) isPlaying = false;
                };

                nextStartTime += audioBuf.duration;
            } catch (e) {
                trace(`再生エラー: ${e.message}`, 'err');
            }
        }

        // ================================================
        // マイク操作
        // ================================================
        async function start() {
            // 即座にUI更新
            txt.innerText = '接続中...';

            try {
                // ユーザージェスチャー内で再生用AudioContextを作成/resume（iOS必須）
                ensurePlayContext();

                // 録音用AudioContext（デバイスデフォルトレート使用）
                if (!micCtx) {
                    micCtx = new (window.AudioContext || window.webkitAudioContext)();
                    trace(`🎤 録音用AudioCtx: ${micCtx.sampleRate}Hz`, 'sys');
                }
                if (micCtx.state === 'suspended') await micCtx.resume();

                // 割り込み機能
                if (isPlaying && audioSources.length > 0) {
                    audioSources.forEach(s => { try { s.stop(); } catch (e) { } });
                    audioSources = [];
                    isPlaying = false;
                    nextStartTime = playCtx ? playCtx.currentTime : 0;
                }

                // WebSocket接続チェック
                if (!ws || ws.readyState !== 1) {
                    trace("🔄 WebSocket接続中...", 'sys');
                    await connectGemini();
                    let attempts = 0;
                    while ((!ws || ws.readyState !== 1) && attempts < 6) {
                        await new Promise(resolve => setTimeout(resolve, 500));
                        attempts++;
                    }
                    if (!ws || ws.readyState !== 1) {
                        trace("❌ WebSocket接続失敗", 'err');
                        txt.innerText = 'READY';
                        return;
                    }
                }

                // マイク初期化
                if (!processor) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });

                    const actualRate = micCtx.sampleRate;
                    trace(`🎤 マイク取得OK (${actualRate}Hz)`, 'sys');

                    // サーバーにサンプルレートを通知（重要：ドキュメント通り任意のレートを送るため）
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({ sample_rate: actualRate }));
                    }

                    const source = micCtx.createMediaStreamSource(stream);
                    processor = micCtx.createScriptProcessor(4096, 1, 1);

                    processor.onaudioprocess = (e) => {
                        if (!isRecording) return;
                        const inputData = e.inputBuffer.getChannelData(0);

                        // マイクレベル表示
                        let p = 0;
                        for (let i = 0; i < inputData.length; i++) {
                            const v = Math.abs(inputData[i]);
                            if (v > p) p = v;
                        }
                        micEl.innerText = `MIC LVL: ${Math.round(p * 100)}%`;

                        // 生PCM16変換（ダウンサンプリングなし）
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcm16[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32767));
                        }

                        if (ws && ws.readyState === 1) {
                            ws.send(pcm16.buffer);
                            pcmSentCount++;
                        }
                    };

                    source.connect(processor);
                    processor.connect(micCtx.destination);
                }

                pcmSentCount = 0;
                playbackCount = 0;
                isRecording = true;
                txt.innerText = 'ON';
                trace("🎤 MIC ON", 'sys');

            } catch (err) {
                trace(`🎤 エラー: ${err.message}`, 'err');
                txt.innerText = 'READY';
            }
        }

        function stop() {
            if (!isRecording) return;
            isRecording = false;
            txt.innerText = 'READY';
            trace(`🎤 MIC OFF (Sent ${pcmSentCount})`, 'sys');
        }

        // ================================================
        // イベントリスナー
        // ================================================
        if ('ontouchstart' in window) {
            trace("📱 Mobile device", 'sys');
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stop(); });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); stop(); });
        } else {
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
        }

        logoutBtn.addEventListener('click', async () => {
            try { await fetch('/auth/logout'); window.location.reload(); } catch (e) { }
        });

        // ================================================
        // ページ読み込み
        // ================================================
        window.addEventListener('load', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                trace(`${APP_VERSION} Loaded.`);
                // 認証済みなら即WebSocket接続
                connectGemini();
                // Service Worker
                if ('serviceWorker' in navigator) {
                    try { await navigator.serviceWorker.register('/sw.js'); } catch (e) { }
                }
            }
        });
    </script>
</body>

</html>
