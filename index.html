<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>woodstock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
</head>
<body class="bg-white text-black min-h-screen">
    <header class="bg-black border-b border-red-600">
        <div class="container mx-auto px-4 py-3">
            <h1 class="text-lg font-bold text-white">woodstock</h1>
            <div class="text-xs text-gray-300">v1.2.9-PWA - Mobile Fixed</div>
        </div>
    </header>
    
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white border border-red-600 rounded-lg p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-black">Voice Assistant</h2>
                    <button id="logout-btn" class="text-sm text-gray-600 hover:text-red-600">ログアウト</button>
                </div>
                
                <div class="mb-6">
                    <button id="mic-btn" class="w-full bg-red-600 hover:bg-red-700 border border-red-600 rounded-lg p-4 transition-colors">
                        <div class="text-center">
                            <div class="text-2xl mb-2">🎤</div>
                            <div id="mic-status" class="text-sm text-white">READY</div>
                        </div>
                    </button>
                </div>
                
                <div class="bg-gray-100 border border-red-600 rounded p-4">
                    <div class="text-sm text-black mb-2">Microphone Level</div>
                    <div id="mic-level" class="text-lg font-mono text-black">MIC LVL: 0%</div>
                </div>
            </div>
            
            <div class="bg-white border border-red-600 rounded-lg p-6">
                <h3 class="text-lg font-semibold text-black mb-4">System Log</h3>
                <div id="trace-log" class="bg-gray-100 border border-red-600 rounded p-4 h-64 overflow-y-auto font-mono text-xs text-black"></div>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('mic-btn');
        const txt = document.getElementById('mic-status');
        const micEl = document.getElementById('mic-level');
        const traceEl = document.getElementById('trace-log');
        const logoutBtn = document.getElementById('logout-btn');

        // Gmail機能（音声のみで操作）
        async function checkImportantEmails() {
            try {
                trace("📧 重要な未読メールを確認中...", 'sys');
                const response = await fetch('/gmail/unread');
                const data = await response.json();
                
                if (data.emails && data.emails.length > 0) {
                    const emailCount = data.emails.length;
                    const subjects = data.emails.slice(0, 3).map(e => e.subject).join(', ');
                    trace(`📧 ${emailCount}件の重要な未読メールがあります`, 'sys');
                    trace(`📧 主な件名: ${subjects}`, 'sys');
                    
                    // Geminiにメール内容を伝えて要約を依頼
                    const emailSummary = `未読の重要メールが${emailCount}件あります。主な件名: ${subjects}`;
                    trace(`📧 AI: ${emailSummary}`, 'sys');
                    
                } else {
                    trace("📧 重要な未読メールはありません", 'sys');
                }
                
            } catch (error) {
                trace(`📧 エラー: ${error.message}`, 'err');
            }
        }

        // Geminiがメール確認要求を検知した場合の処理
        function handleEmailRequest(userMessage) {
            if (userMessage.includes('メール') && 
                (userMessage.includes('未読') || userMessage.includes('大事') || userMessage.includes('確認'))) {
                checkImportantEmails();
                return true;
            }
            return false;
        }

        // 認証チェック
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                const auth = await response.json();
                
                if (!auth.authenticated) {
                    // 社内ツール用：簡易ログイン画面
                    document.body.innerHTML = `
                        <div class="h-screen flex flex-col items-center justify-center bg-white text-black">
                            <div class="text-center">
                                <h1 class="text-3xl font-bold mb-2 text-black">woodstock</h1>
                                <div class="text-xs text-gray-600 mb-6">v1.2.9-PWA - Mobile Fixed</div>
                                <p class="mb-6">社内ツール用ログイン</p>
                                <div class="bg-white border border-red-600 rounded-lg p-6 mb-4">
                                    <input type="email" id="email-input" placeholder="woodstock.co.jpメールアドレス" 
                                           class="w-full px-4 py-2 rounded bg-white border border-red-600 text-black mb-4">
                                    <input type="password" id="password-input" placeholder="パスワード" 
                                           class="w-full px-4 py-2 rounded bg-white border border-red-600 text-black mb-4">
                                    <button onclick="simpleLogin()" 
                                            class="w-full bg-red-600 hover:bg-red-700 border border-red-600 px-6 py-3 rounded-lg text-white">
                                        ログイン
                                    </button>
                                </div>
                                <div class="text-sm text-gray-600">
                                    <!-- Google認証は現在メンテナンス中です -->
                                </div>
                            </div>
                        </div>
                    `;
                    return false;
                }
                console.log('ログイン済み:', auth.email);
                return true;
            } catch (error) {
                console.error('認証チェックエラー:', error);
                return false;
            }
        }

        // 簡易ログイン関数
        async function simpleLogin() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            
            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください');
                return;
            }
            
            if (!email.endsWith('@woodstock.co.jp')) {
                alert('woodstock.co.jpドメインのメールアドレスを入力してください');
                return;
            }
            
            // 簡易認証（デモ用）
            try {
                const response = await fetch('/simple-auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('ログインに失敗しました');
                }
            } catch (error) {
                alert('ログインエラー: ' + error.message);
            }
        }

        function trace(msg, type = '') {
            if (type === 'audio' || type === 'recv' || type === 'send') return; // 高頻度ログをスキップ
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            if (traceEl.childNodes.length > 100) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
        }

        let ws, audioCtx, processor, isRecording = false, nextStartTime = 0, pcmSentCount = 0, isPlaying = false, audioSources = [];

        async function connectGemini() {
            const MODEL_NAME = "models/gemini-2.5-flash-native-audio-preview-12-2025";
            trace(`INIT: ${MODEL_NAME}`, 'sys');
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // セッションIDを取得してWebSocketに渡す
                const cookies = document.cookie.split(';');
                let sessionId = null;
                for (let cookie of cookies) {
                    const [name, value] = cookie.trim().split('=');
                    if (name === 'session_id') {
                        sessionId = value;
                        break;
                    }
                }
                
                if (!sessionId) {
                    trace("❌ セッションIDが見つかりません", 'err');
                    return;
                }

                // WebSocket URLにセッションIDを追加
                const wsUrl = `ws://${window.location.host}/ws?session_id=${sessionId}`;
                ws = new WebSocket(wsUrl);

                // Manual 143: Binary-capable configuration
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    trace("🔥 NETWORK_LINK: OK (Binary Mode)", 'sys');
                    const setup = {
                        setup: {
                            model: MODEL_NAME,
                            generation_config: { response_modalities: ["AUDIO"] }
                        }
                    };
                    ws.send(JSON.stringify(setup));
                    trace("SENT: JSON Setup package", 'send');
                };

                ws.onclose = (ev) => {
                    trace(`🔌 CLOSED [${ev.code}] ${ev.reason}`, 'err');
                    // 自動再接続を試みる
                    if (isRecording) {
                        trace("🔄 録音中に切断：再接続を試みます", 'sys');
                        setTimeout(() => {
                            if (isRecording) {
                                connectGemini();
                            }
                        }, 1000);
                    }
                };
                ws.onerror = (e) => {
                    trace("❌ NETWORK_ERROR", 'err');
                    // エラー時も再接続を試みる
                    if (isRecording) {
                        trace("🔄 エラー発生：再接続を試みます", 'sys');
                        setTimeout(() => {
                            if (isRecording) {
                                connectGemini();
                            }
                        }, 2000);
                    }
                };

                ws.onmessage = async (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        // Binary Frame received (Likely Raw Audio per Manual 143)
                        const bytes = new Uint8Array(e.data);
                        trace(`RECV_BIN: ${bytes.length} bytes [${bytes.slice(0, 4).join(',')}]`, 'audio');

                        // Try parsing as JSON first in case it's a JSON frame sent as binary
                        try {
                            const text = new TextDecoder().decode(e.data);
                            const json = JSON.parse(text);
                            trace(`RECV_JSON_IN_BIN: ${text}`, 'recv');
                            handleJSON(json);
                        } catch (err) {
                            // Truly binary PCM audio (24kHz as per Manual 476)
                            playRawBinaryPCM(e.data);
                        }
                    } else {
                        // Text Frame received (Standard JSON)
                        trace(`RECV_TEXT: ${e.data}`, 'recv');
                        try { handleJSON(JSON.parse(e.data)); } catch (err) { trace(`PARSE_ERR: ${err.message}`, 'err'); }
                    }
                };

                // スマホ対応：マイク設定を最適化
                const constraints = {
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 16000,
                        channelCount: 1
                    }
                };
                
                // iOS対応：getUserMediaの前にAudioContextを再開
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                
                // スマホ対応：マイクアクセスのタイムアウト設定
                const stream = await Promise.race([
                    navigator.mediaDevices.getUserMedia(constraints),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('MIC_TIMEOUT')), 10000))
                ]);
                
                trace("🎤 MIC ACCESS OK", 'sys');
                const source = audioCtx.createMediaStreamSource(stream);
                
                // iOS/Safari対応：AudioWorkNodeが使えない場合のフォールバック
                if (audioCtx.createScriptProcessor) {
                    processor = audioCtx.createScriptProcessor(2048, 1, 1);
                    source.connect(processor); 
                    processor.connect(audioCtx.destination);
                } else if (audioCtx.createAudioWorkletNode) {
                    // AudioWorkNode対応（モダンブラウザ）
                    try {
                        await audioCtx.audioWorklet.addModule('data:application/javascript,' + encodeURIComponent(`
                            class MicProcessor extends AudioWorkletProcessor {
                                process(inputs, outputs) {
                                    const input = inputs[0];
                                    if (input && input.length > 0) {
                                        const inputData = input[0];
                                        // データを処理してグローバル変数に保存
                                        if (typeof self.postMessage === 'function') {
                                            self.postMessage({ audioData: Array.from(inputData[0]) });
                                        }
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('mic-processor', MicProcessor);
                        `));
                        
                        processor = audioCtx.createAudioWorkletNode('mic-processor');
                        processor.port.onmessage = (e) => {
                            if (e.data.audioData) {
                                this.handleAudioData(new Float32Array(e.data.audioData));
                            }
                        };
                        source.connect(processor);
                        processor.connect(audioCtx.destination);
                    } catch (e) {
                        trace("⚠️ AudioWorkNode failed", 'err');
                        // ScriptProcessorにフォールバック
                        processor = audioCtx.createScriptProcessor(2048, 1, 1);
                        source.connect(processor); 
                        processor.connect(audioCtx.destination);
                    }
                } else {
                    trace("⚠️ No audio processing available", 'err');
                    return;
                }

                // AudioWorkNode用のハンドラ関数
                window.handleAudioData = function(input) {
                    let p = 0; for (let v of input) if (Math.abs(v) > p) p = Math.abs(v);
                    micEl.innerText = `MIC LVL: ${Math.round(p * 100)}%`;

                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    
                    // 音声データの検証（スマホ対応）
                    let hasSound = false;
                    for (let i = 0; i < input.length; i++) {
                        if (Math.abs(input[i]) > 0.001) {
                            hasSound = true;
                            break;
                        }
                    }
                    
                    if (!hasSound) {
                        trace("🔇 No audio detected", 'sys');
                        return;
                    }
                    
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;

                    const packet = {
                        realtime_input: {
                            media_chunks: [{
                                data: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer))),
                                mime_type: "audio/pcm;rate=16000"
                            }]
                        }
                    };
                    ws.send(JSON.stringify(packet));
                    pcmSentCount++;
                    trace(`📤 Sent audio chunk: ${pcmSentCount}`, 'send');
                };

                processor.onaudioprocess = (e) => {
                    window.handleAudioData(e.inputBuffer.getChannelData(0));
                };

            } catch (err) { 
                trace(`BOOT_ERR: ${err.message}`, 'err');
                console.error('Microphone error:', err);
            }
        }

        function handleJSON(data) {
            if (data.setupComplete || data.setup_complete) trace("⭐ setupComplete received!", 'important');
            if (data.error) trace(`🚨 SERVER_ERROR: ${JSON.stringify(data.error)}`, 'err');

            const sc = data.serverContent || data.server_content;
            if (sc) {
                const turn = sc.modelTurn || sc.model_turn;
                if (turn?.parts?.[0]) {
                    const part = turn.parts[0];
                    if (part.inlineData || part.inline_data) {
                        const audioB64 = (part.inlineData || part.inline_data).data;
                        trace(`🔊 AUDIO_JSON RECEIVED (${audioB64.length} chars)`, 'important');
                        playRawPCM_Base64(audioB64);
                    }
                }
            }
        }

        function playRawBinaryPCM(buffer) {
            try {
                const pcm16 = new Int16Array(buffer);
                const floats = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                const audioBuf = audioCtx.createBuffer(1, floats.length, 24000); // 24kHz stream
                audioBuf.getChannelData(0).set(floats);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuf; 
                source.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (nextStartTime < now) nextStartTime = now;
                source.start(nextStartTime);
                
                // 割り込み対応：音源を追跡
                audioSources.push(source);
                isPlaying = true;
                
                source.onended = () => {
                    // 再生終了時に配列から削除
                    const index = audioSources.indexOf(source);
                    if (index > -1) {
                        audioSources.splice(index, 1);
                    }
                    if (audioSources.length === 0) {
                        isPlaying = false;
                    }
                };
                
                nextStartTime += audioBuf.duration;
            } catch (e) { trace(`BIN_PLAY_ERR: ${e.message}`, 'err'); }
        }

        function playRawPCM_Base64(base64) {
            const binary = atob(base64), bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            playRawBinaryPCM(bytes.buffer);
        }

        async function start() {
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            
            // 割り込み機能：AIが喋っている場合は停止
            if (isPlaying && audioSources.length > 0) {
                trace("🔇 AI音声を停止して割り込み録音", 'sys');
                audioSources.forEach(source => {
                    try {
                        source.stop();
                    } catch (e) {
                        // すでに停止している場合がある
                    }
                });
                audioSources = [];
                isPlaying = false;
                nextStartTime = audioCtx.currentTime;
            }
            
            // WebSocket接続をチェック・再接続
            if (!ws || ws.readyState !== 1) {
                trace("🔄 WebSocketを再接続", 'sys');
                await connectGemini();
                // 接続待機
                let attempts = 0;
                while ((!ws || ws.readyState !== 1) && attempts < 10) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    attempts++;
                }
                if (!ws || ws.readyState !== 1) {
                    trace("❌ WebSocket接続失敗", 'err');
                    return;
                }
            }
            
            pcmSentCount = 0; isRecording = true;
            btn.classList.add('recording'); txt.innerText = 'ON';
            trace("🎤 MIC ON", 'sys');
            
            // スマホ対応：タッチイベントで録音開始
            if ('ontouchstart' in window) {
                trace("📱 Mobile device detected", 'sys');
            }
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording'); txt.innerText = 'READY';
            trace(`🎤 MIC OFF (Sent ${pcmSentCount})`, 'sys');
            
            // WebSocketが接続されている場合のみ送信
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ realtime_input: { audio_stream_end: true } }));
                trace("SENT: audio_stream_end", 'send');
            } else {
                trace("⚠️ WebSocket未接続：audio_stream_end未送信", 'sys');
            }
        }

        // スマホ対応：タッチイベントの改善
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            start();
        });
        
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stop();
        });
        
        btn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            stop();
        });

        // PC用：マウスイベント（従来通り）
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', stop);
        btn.addEventListener('mouseleave', stop);

        // ログアウト処理
        logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('/auth/logout');
                window.location.reload();
            } catch (error) {
                console.error('ログアウトエラー:', error);
            }
        });

        // ページ読み込み時に認証チェック
        window.addEventListener('load', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                trace("v1.2.8 Hybrid Protocol Loaded.");
                
                // Service Worker登録
                if ('serviceWorker' in navigator) {
                    try {
                        const registration = await navigator.serviceWorker.register('/sw.js');
                        console.log('Service Worker registered:', registration);
                    } catch (error) {
                        console.log('Service Worker registration failed:', error);
                    }
                }
            }
        });
    </script>
</body>
</html>
