<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>woodstock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
</head>

<body class="bg-white text-black min-h-screen">
    <header class="bg-black border-b border-red-600">
        <div class="container mx-auto px-4 py-3">
            <h1 class="text-lg font-bold text-white">woodstock</h1>
            <div class="text-xs text-gray-300">v1.5.8-legacy</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white border border-red-600 rounded-lg p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-black">Voice Assistant</h2>
                    <button id="logout-btn" class="text-sm text-gray-600 hover:text-red-600">ログアウト</button>
                </div>

                <div class="mb-6">
                    <button id="mic-btn"
                        class="w-full bg-red-600 hover:bg-red-700 border border-red-600 rounded-lg p-4 transition-colors">
                        <div class="text-center">
                            <div class="text-2xl mb-2">🎤</div>
                            <div id="mic-status" class="text-sm text-white">READY</div>
                        </div>
                    </button>
                </div>

                <div class="bg-gray-100 border border-red-600 rounded p-4">
                    <div class="text-sm text-black mb-2">Microphone Level</div>
                    <div id="mic-level" class="text-lg font-mono text-black">MIC LVL: 0%</div>
                </div>
            </div>

            <div class="bg-white border border-red-600 rounded-lg p-6">
                <h3 class="text-lg font-semibold text-black mb-4">System Log</h3>
                <div id="trace-log"
                    class="bg-gray-100 border border-red-600 rounded p-4 h-64 overflow-y-auto font-mono text-xs text-black">
                </div>
            </div>
        </div>
    </main>

    <script>
        const APP_VERSION = 'v1.5.8-legacy';
        const btn = document.getElementById('mic-btn');
        const txt = document.getElementById('mic-status');
        const micEl = document.getElementById('mic-level');
        const traceEl = document.getElementById('trace-log');
        const logoutBtn = document.getElementById('logout-btn');

        function trace(msg, type = '') {
            if (type === 'audio') return;
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            traceEl.scrollTop = traceEl.scrollHeight;
        }

        // ================================================
        // 簡易ダウンサンプリング (for 16kHz)
        // ================================================
        function downsampleBuffer(buffer, sampleRate, outSampleRate) {
            if (outSampleRate >= sampleRate) return buffer;
            if (sampleRate > outSampleRate) {
                var ratio = sampleRate / outSampleRate;
                var newLength = Math.round(buffer.length / ratio);
                var result = new Float32Array(newLength);
                var offsetResult = 0;
                var offsetBuffer = 0;
                while (offsetResult < result.length) {
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                    var accum = 0, count = 0;
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                        accum += buffer[i];
                        count++;
                    }
                    result[offsetResult] = accum / count;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
                return result;
            }
            return buffer;
        }

        let ws, micCtx, playCtx, processor, isRecording = false;
        let nextStartTime = 0;

        // 再生用コンテキスト (24kHz)
        function ensurePlayContext() {
            if (!playCtx) {
                playCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (playCtx.state === 'suspended') playCtx.resume();
            return playCtx;
        }

        async function connectGemini() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => trace("🔥 サーバー接続OK");
                ws.onclose = (ev) => trace(`🔌 切断 [${ev.code}]`);
                ws.onmessage = (e) => {
                    if (e.data instanceof ArrayBuffer) {
                        playRawBinaryPCM(e.data);
                    }
                };
            } catch (err) { trace(`接続エラー: ${err.message}`); }
        }

        function playRawBinaryPCM(buffer) {
            try {
                const ctx = ensurePlayContext();
                const pcm16 = new Int16Array(buffer);
                if (pcm16.length === 0) return;

                const floats = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                // 24kHzバッファ作成
                const audioBuf = ctx.createBuffer(1, floats.length, 24000);
                audioBuf.getChannelData(0).set(floats);
                const source = ctx.createBufferSource();
                source.buffer = audioBuf;
                source.connect(ctx.destination);

                const now = ctx.currentTime;
                if (nextStartTime < now) nextStartTime = now;
                source.start(nextStartTime);
                nextStartTime += audioBuf.duration;
            } catch (e) { console.error(e); }
        }

        async function start() {
            txt.innerText = '接続中...';
            try {
                ensurePlayContext(); // 再生用Resume

                if (!ws || ws.readyState !== 1) await connectGemini();

                if (!micCtx) micCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (micCtx.state === 'suspended') await micCtx.resume();

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                const actualRate = micCtx.sampleRate;
                trace(`🎤 マイクOK (${actualRate}Hz -> 16000Hz)`);

                // レート通知はしない（サーバーをシンプルにしたため）

                const source = micCtx.createMediaStreamSource(stream);
                processor = micCtx.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const inputData = e.inputBuffer.getChannelData(0);

                    // レベル表示
                    let p = 0;
                    for (let i = 0; i < inputData.length; i++) { if (Math.abs(inputData[i]) > p) p = Math.abs(inputData[i]); }
                    micEl.innerText = `MIC LVL: ${Math.round(p * 100)}%`;

                    // ダウンサンプリング (16kHz化)
                    const downsampled = downsampleBuffer(inputData, actualRate, 16000);

                    // PCM16変換して送信
                    const pcm16 = new Int16Array(downsampled.length);
                    for (let i = 0; i < downsampled.length; i++) {
                        pcm16[i] = Math.max(-32768, Math.min(32767, downsampled[i] * 32767));
                    }

                    if (ws && ws.readyState === 1) ws.send(pcm16.buffer);
                };

                source.connect(processor);
                processor.connect(micCtx.destination); // これで音が鳴るのを防ぐために volume0 の gainNode に繋ぐ手もあるが...
                // Chromeではoutputに繋がないとprocessが止まることがあるが、
                // iOS Safariでは逆につなぐとハウリングする可能性がある。
                // ここでは processor.connect(micCtx.destination) は一旦外す（必要ならGainNode(0)に繋ぐ）
                // ただし古いコードでは繋いでいた可能性が高い。
                // 安全策として、GainNode(0)経由で繋ぐ。
                const mute = micCtx.createGain();
                mute.gain.value = 0;
                processor.connect(mute);
                mute.connect(micCtx.destination);

                isRecording = true;
                txt.innerText = 'ON';

            } catch (err) {
                trace(`エラー: ${err.message}`);
                txt.innerText = 'READY';
            }
        }

        function stop() {
            isRecording = false;
            txt.innerText = 'READY';
            trace("🎤 MIC OFF");
        }

        if ('ontouchstart' in window) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stop(); });
        } else {
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
        }

        window.addEventListener('load', async () => {
            connectGemini();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
        });
    </script>
</body>

</html>
