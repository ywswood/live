<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no text-align:center">
    <title>Voice Secretary v1.1.1 - Gemini 2.5 Native</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" onload="trace('GSI JS Loaded')" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        :root {
            --cyan: #00f2ea;
            --pink: #ff0050;
            --grad: linear-gradient(135deg, #ff0050, #00f2ea);
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--grad);
            mask: radial-gradient(transparent 74px, #000 76px);
            -webkit-mask: radial-gradient(transparent 74px, #000 76px);
            animation: spin 15s linear infinite;
        }

        .recording .ring {
            animation: pulse 0.7s infinite;
            mask: none;
            -webkit-mask: none;
            background: var(--pink);
            opacity: 0.5;
            transform: scale(1.2);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1.05);
            }

            50% {
                transform: scale(1.2);
            }
        }

        #fullTrace {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            background: rgba(0, 0, 0, 0.95);
            border-top: 1px solid #444;
            font-size: 9px;
            padding: 10px;
            overflow-y: scroll;
            z-index: 1000;
            color: #0f0;
            line-height: 1.2;
        }

        .trace-err {
            color: #f44;
            font-weight: bold;
        }

        .trace-sys {
            color: #aaa;
        }

        .trace-send {
            color: #0af;
        }

        .trace-recv {
            color: #f0f;
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center">
    <div class="flex-1 w-full max-w-md flex flex-col items-center justify-between py-10 px-8 text-center"
        style="height: 55vh">
        <header>
            <h1 class="text-xl font-bold italic tracking-tighter">GEMINI 2.5 NATIVE <span
                    class="text-xs text-zinc-600 block">v1.1.1 RAW AUDIO</span></h1>
        </header>

        <div class="main flex-1 flex items-center justify-center">
            <div id="btn" class="relative w-40 h-40 cursor-pointer active:scale-95 transition-transform">
                <div class="ring"></div>
                <div class="fill absolute inset-3 bg-zinc-950 rounded-full flex flex-col items-center justify-center">
                    <div id="recText" class="text-[10px] font-bold text-zinc-600 tracking-widest uppercase">STANDBY
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full pb-4">
            <div id="status" class="text-zinc-500 text-[10px] mb-2 font-mono">Trace initialized.</div>
            <div id="authBtn"
                class="bg-white text-black px-6 py-2 rounded-full font-bold text-[10px] cursor-pointer hidden mx-auto">
                GOOGLE LOGIN</div>
        </div>
    </div>

    <!-- Trace Logger -->
    <div id="fullTrace"></div>

    <script>
        const API_KEY = "AIzaSyA11HNJShWzJcEvfZh9JewKgzLUMSMSmpU";
        const CLIENT_ID = "218926241376-m5rqri5is7nsaur63vrpqjkchmai378p.apps.googleusercontent.com";
        const SCOPES = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/tasks";

        const traceEl = document.getElementById('fullTrace');
        const st = document.getElementById('status'), txt = document.getElementById('recText'), authBtn = document.getElementById('authBtn'), btn = document.getElementById('btn');

        function trace(msg, type = '') {
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            if (traceEl.childNodes.length > 300) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
            st.innerText = msg;
        }
        traceEl.onclick = () => traceEl.innerHTML = '';
        window.onerror = (m, u, l) => trace(`JS_ERR: ${m} (L${l})`, 'err');

        let tokenClient, accessToken, ws, audioCtx, processor, isRecording = false;

        function initAuthClient() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID, scope: SCOPES,
                    callback: (res) => {
                        accessToken = res.access_token;
                        authBtn.style.display = 'none';
                        trace("✅ AUTH SUCCESS", 'sys');
                    },
                });
                authBtn.classList.remove('hidden');
            } catch (err) { trace("GSI_INIT_ERR: " + err.message, 'err'); }
        }
        authBtn.onclick = () => tokenClient && tokenClient.requestAccessToken({ prompt: 'consent' });

        // PCM再生用キュー
        let nextStartTime = 0;

        async function connectGemini() {
            if (!accessToken) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // 仕様に基づく v1beta エンドポイント
                const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
                trace(`Connecting v1beta...`, 'sys');
                ws = new WebSocket(url);

                ws.onopen = () => {
                    trace("✅ WS OPENED", 'sys');
                    const setup = {
                        setup: {
                            model: "models/gemini-2.5-flash",
                            generation_config: { response_modalities: ["audio"] }
                        }
                    };
                    ws.send(JSON.stringify(setup));
                    trace("SETUP SENT", 'send');
                };

                ws.onclose = (ev) => trace(`🔌 CLOSED Code:${ev.code}`, 'err');
                ws.onerror = (err) => trace("❌ WS ERR (Key/Domain?)", 'err');

                ws.onmessage = async (e) => {
                    const data = JSON.parse(e.data);
                    if (data.setupComplete) trace("✅ GEMINI READY", 'sys');

                    // 24kHz Raw PCM 再生ロジック
                    if (data.serverContent?.modelTurn?.parts?.[0]?.inlineData) {
                        const base64 = data.serverContent.modelTurn.parts[0].inlineData.data;
                        const binary = atob(base64);
                        const len = binary.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);

                        // 16-bit PCM (Little Endian) -> Float32 変換
                        const pcm16 = new Int16Array(bytes.buffer);
                        const floats = new Float32Array(pcm16.length);
                        for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                        // 24kHz で再生用バッファ作成
                        const audioBuf = audioCtx.createBuffer(1, floats.length, 24000);
                        audioBuf.getChannelData(0).set(floats);

                        const source = audioCtx.createBufferSource();
                        source.buffer = audioBuf;
                        source.connect(audioCtx.destination);

                        // 途切れないようにスケジュール再生
                        const now = audioCtx.currentTime;
                        if (nextStartTime < now) nextStartTime = now;
                        source.start(nextStartTime);
                        nextStartTime += audioBuf.duration;

                        if (pcm16.length > 0) trace(`PLAYING: ${pcm16.length} samples (24kHz)`, 'recv');
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                processor = audioCtx.createScriptProcessor(2048, 1, 1);
                source.connect(processor); processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;

                    const packet = {
                        realtime_input: {
                            media_chunks: [{
                                data: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer))),
                                mime_type: "audio/pcm"
                            }]
                        }
                    };
                    ws.send(JSON.stringify(packet));
                };

            } catch (err) { trace(`CRITICAL_ERR: ${err.message}`, 'err'); }
        }

        async function start() {
            if (!accessToken) { trace("LOGIN FIRST", 'err'); return; }
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            if (!ws || ws.readyState !== 1) await connectGemini();
            isRecording = true;
            btn.classList.add('recording'); txt.innerText = 'LISTENING';
            nextStartTime = 0;
            trace("--- REC START ---", 'sys');
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording'); txt.innerText = 'READY';
            trace("--- REC STOP ---", 'sys');
        }

        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = (e) => { e.preventDefault(); start(); }; btn.ontouchend = stop;
    </script>
</body>

</html>
