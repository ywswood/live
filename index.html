<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no text-align:center">
    <title>Voice Secretary v1.1.6 - Gemini 2.5 Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cyan: #00f2ea;
            --pink: #ff0050;
            --grad: linear-gradient(135deg, #ff0050, #00f2ea);
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--grad);
            mask: radial-gradient(transparent 74px, #000 76px);
            -webkit-mask: radial-gradient(transparent 74px, #000 76px);
            animation: spin 15s linear infinite;
        }

        .recording .ring {
            animation: pulse 0.7s infinite;
            mask: none;
            -webkit-mask: none;
            background: var(--pink);
            opacity: 0.5;
            transform: scale(1.2);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1.05);
            }

            50% {
                transform: scale(1.2);
            }
        }

        #fullTrace {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: rgba(0, 0, 0, 0.95);
            border-top: 1px solid #444;
            font-size: 9px;
            padding: 10px;
            overflow-y: scroll;
            z-index: 1000;
            color: #0f0;
            line-height: 1.2;
        }

        .trace-err {
            color: #f44;
            font-weight: bold;
        }

        .trace-sys {
            color: #aaa;
        }

        .trace-send {
            color: #0af;
        }

        .trace-recv {
            color: #f0f;
        }

        .trace-conn {
            color: #fff;
            background: #00f;
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center">
    <!-- UI Area -->
    <div class="flex-1 w-full max-w-md flex flex-col items-center justify-between py-10 px-8 text-center"
        style="height: 60vh">
        <header>
            <h1 class="text-lg font-bold italic tracking-tighter uppercase">Gemini 2.5 Live <span
                    class="text-[9px] text-zinc-600 block">v1.1.6 (Model 12-2025)</span></h1>
        </header>
        <div class="main flex-1 flex items-center justify-center">
            <div id="btn" class="relative w-40 h-40 cursor-pointer active:scale-95 transition-transform">
                <div class="ring"></div>
                <div class="fill absolute inset-3 bg-zinc-950 rounded-full flex flex-col items-center justify-center">
                    <div id="recText" class="text-[10px] font-bold text-zinc-600 tracking-widest uppercase">READY</div>
                </div>
            </div>
        </div>
        <div class="w-full pb-4">
            <div id="status" class="text-zinc-500 text-[9px] mb-2 font-mono uppercase">Waiting for Press...</div>
        </div>
    </div>

    <!-- Trace Logger -->
    <div id="fullTrace">
        <div class="trace-sys">--- START TRACE (V1.1.6 MODEL 12-2025) ---</div>
    </div>

    <script>
        const API_KEY = "AIzaSyA11HNJShWzJcEvfZh9JewKgzLUMSMSmpU";
        const traceEl = document.getElementById('fullTrace'), st = document.getElementById('status'), txt = document.getElementById('recText'), btn = document.getElementById('btn');

        function trace(msg, type = '') {
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const div = document.createElement('div');
            div.className = type ? 'trace-' + type : '';
            div.innerText = `[${time}] ${msg}`;
            traceEl.appendChild(div);
            if (traceEl.childNodes.length > 500) traceEl.removeChild(traceEl.firstChild);
            traceEl.scrollTop = traceEl.scrollHeight;
            st.innerText = msg;
        }
        traceEl.onclick = () => traceEl.innerHTML = '';

        let ws, audioCtx, processor, isRecording = false, nextStartTime = 0, pcmSentCount = 0;

        async function connectGemini() {
            const MODEL_NAME = "models/gemini-live-2.5-flash-preview-native-audio-12-2025";
            trace(`Connecting with: ${MODEL_NAME}`, 'sys');
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // WebSocket endpoint for Gemini Multimodal Live API
                const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
                ws = new WebSocket(url);

                ws.onopen = () => {
                    trace("🔥 NETWORK LINK ESTABLISHED", 'conn');
                    const setup = {
                        setup: {
                            model: MODEL_NAME,
                            generation_config: { response_modalities: ["audio"] }
                        }
                    };
                    ws.send(JSON.stringify(setup));
                    trace("SENT: Setup JSON Configuration", 'send');
                };

                ws.onclose = (ev) => trace(`🔌 WS CLOSED. Code:${ev.code} Reason:${ev.reason || 'None'}`, 'err');
                ws.onerror = (err) => trace("❌ WS SOCKET ERROR", 'err');

                ws.onmessage = async (e) => {
                    const data = JSON.parse(e.data);
                    if (data.setupComplete) trace("⭐ GEMINI 2.5 READY!", 'conn');

                    if (data.serverContent?.modelTurn?.parts?.[0]?.inlineData) {
                        const base64 = data.serverContent.modelTurn.parts[0].inlineData.data;
                        const binary = atob(base64), bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                        const pcm16 = new Int16Array(bytes.buffer);
                        const floats = new Float32Array(pcm16.length);
                        for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768.0;

                        const audioBuf = audioCtx.createBuffer(1, floats.length, 24000); // Output 24kHz raw PCM
                        audioBuf.getChannelData(0).set(floats);
                        const source = audioCtx.createBufferSource();
                        source.buffer = audioBuf; source.connect(audioCtx.destination);

                        const now = audioCtx.currentTime;
                        if (nextStartTime < now) nextStartTime = now;
                        source.start(nextStartTime);
                        nextStartTime += audioBuf.duration;
                        trace(`RECV: Audio Data (${pcm16.length} samples)`, 'recv');
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                trace("🎤 Microphone access granted.", 'sys');
                const source = audioCtx.createMediaStreamSource(stream);
                processor = audioCtx.createScriptProcessor(2048, 1, 1);
                source.connect(processor); processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== 1) return;
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;

                    const packet = {
                        realtime_input: {
                            media_chunks: [{
                                data: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer))),
                                mime_type: "audio/pcm"
                            }]
                        }
                    };
                    ws.send(JSON.stringify(packet));
                    pcmSentCount++;
                    if (pcmSentCount % 40 === 0) trace(`SEND: Voice streaming (${pcmSentCount} pkts)`, 'send');
                };

            } catch (err) { trace(`INIT_ERR: ${err.message}`, 'err'); }
        }

        async function start() {
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            if (!ws || ws.readyState !== 1) await connectGemini();
            pcmSentCount = 0; isRecording = true;
            btn.classList.add('recording'); txt.innerText = 'LISTENING';
            trace("--- RECORDING START ---", 'sys');
        }

        function stop() {
            isRecording = false;
            btn.classList.remove('recording'); txt.innerText = 'READY';
            trace(`--- RECORDING STOP --- (${pcmSentCount} sent)`, 'sys');
        }

        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = (e) => { e.preventDefault(); start(); }; btn.ontouchend = stop;

        trace("v1.1.6 Model-12-2025 Loader.");
    </script>
</body>

</html>
